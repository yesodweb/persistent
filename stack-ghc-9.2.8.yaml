snapshot: lts-20.26 # GHC 9.2.8

packages:
- ./persistent
- ./persistent-sqlite
- ./persistent-test
- ./persistent-mongoDB
# Warning: the Haskell mysql package (a dependency) does not support Windows, unpatched:
- ./persistent-mysql
- ./persistent-postgresql
- ./persistent-redis
- ./persistent-qq

allow-newer: true
allow-newer-deps:
# lts-20.26 specifies MonadRandom-0.5.3 which has an unnecessarily restrictive upper bound on primitive:
- MonadRandom
# aeson-2.1.2.1 which has unnecessarily restrictive upper bounds on hashable and primitive:
- aeson
# lts-20.26 specifies quickcheck-instances-0.3.29.1 which has an unnecessarily restrictive upper bound on primitive:
- quickcheck-instances

flags:
  ansi-terminal:
    # lts-20.26 specifies Win32-2.12.0.1:
    win32-2-13-1: false

